<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6f5c">
<title>우리 집 마련 플래너</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2f5f3;--card:#fff;--ink:#1c2a28;--mute:#5e6f6b;--line:#d9e2de;
  --pine:#1f6f5c;--pine-ink:#fff;--pine-soft:#e1f0ea;
  --amber:#8f5a00;--amber-soft:#fbefd5;--red:#b23a2a;--red-soft:#f8e1dd;--blue:#3b55a5;
  --c1:#1f6f5c;--c2:#c27a0a;--c3:#4a62b3;
  --r:10px;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#111816;--card:#1a2321;--ink:#e6efec;--mute:#9bb0aa;--line:#2e3c38;
  --pine:#52bd9f;--pine-ink:#06201a;--pine-soft:#173a30;
  --amber:#e6b560;--amber-soft:#3a2c10;--red:#f08a7a;--red-soft:#3d1c17;--blue:#8aa2ee;
  --c1:#52bd9f;--c2:#e6b560;--c3:#8aa2ee;
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  padding:env(safe-area-inset-top,0) 0 calc(72px + env(safe-area-inset-bottom,0));font-variant-numeric:tabular-nums}
header{position:sticky;top:0;z-index:20;background:var(--pine);color:var(--pine-ink);padding:calc(10px + env(safe-area-inset-top,0)) 14px 10px;display:flex;align-items:center;gap:10px}
header h1{font-size:17px;margin:0;flex:1;font-weight:700;letter-spacing:-.01em}
.chip{font-size:12px;padding:3px 9px;border-radius:99px;background:rgba(255,255,255,.18);white-space:nowrap}
.chip.err{background:var(--red);color:#fff}
.iconbtn{background:rgba(255,255,255,.18);border:0;color:inherit;border-radius:8px;padding:6px 10px;font:inherit;cursor:pointer}
main{max-width:1000px;margin:0 auto;padding:12px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0)}
nav button{flex:1;border:0;background:none;color:var(--mute);padding:10px 2px 9px;font:inherit;font-size:13px;cursor:pointer;border-top:3px solid transparent}
nav button[aria-current=true]{color:var(--pine);font-weight:700;border-top-color:var(--pine)}
h2{font-size:18px;margin:6px 0 10px}
h3{font-size:15px;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end}
.row>*{flex:1 1 130px;min-width:0}
.row>.sm{flex:0 1 90px}
.row>.fit{flex:0 0 auto}
label.f{display:block;font-size:12px;color:var(--mute)}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 9px;margin-top:2px}
textarea{min-height:56px;resize:vertical}
input[type=checkbox],input[type=radio]{width:auto;margin:0 6px 0 0;accent-color:var(--pine)}
:focus-visible{outline:2px solid var(--pine);outline-offset:1px}
label.chk{display:inline-flex;align-items:center;font-size:14px;margin:4px 12px 4px 0;cursor:pointer}
button.b{font:inherit;border:1px solid var(--pine);background:var(--pine);color:var(--pine-ink);border-radius:8px;padding:8px 12px;cursor:pointer}
button.b.ghost{background:none;color:var(--pine)}
button.b.danger{border-color:var(--red);color:var(--red);background:none}
button.b.sm{padding:4px 9px;font-size:13px}
.hint{font-size:12px;color:var(--mute);margin:2px 0 0}
.big{font-size:22px;font-weight:700;letter-spacing:-.02em}
.badge{display:inline-block;font-size:11px;padding:1px 8px;border-radius:99px;font-weight:700;vertical-align:middle}
.badge.off{background:var(--pine-soft);color:var(--pine)}
.badge.apx{background:var(--amber-soft);color:var(--amber)}
.badge.bad{background:var(--red-soft);color:var(--red)}
.badge.ok{background:var(--pine-soft);color:var(--pine)}
.badge.mid{background:var(--bg);color:var(--mute);border:1px solid var(--line)}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.sum>div{background:var(--bg);border-radius:8px;padding:8px 10px}
.sum small{display:block;color:var(--mute);font-size:12px}
.pos{color:var(--pine)}.neg{color:var(--red)}
.warn{border-left:4px solid var(--amber);background:var(--amber-soft);color:var(--ink);padding:6px 10px;border-radius:6px;margin:6px 0;font-size:14px}
.warn.red{border-left-color:var(--red);background:var(--red-soft)}
.warn.info{border-left-color:var(--blue);background:var(--bg)}
.check{display:flex;gap:6px;font-size:14px;margin:3px 0}
.check b{flex:0 0 18px}
details{margin:8px 0}
summary{cursor:pointer;font-weight:500;color:var(--pine)}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:right;vertical-align:top}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--card);min-width:112px}
th{font-weight:700;background:var(--card)}
td.best{background:var(--pine-soft);font-weight:700}
td.worst{color:var(--red)}
td.txt{text-align:left;font-size:13px;min-width:170px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;margin-top:4px}
.legend i{display:inline-block;width:12px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}
svg text{fill:var(--mute);font-size:11px}
.ln{fill:none;stroke-width:2.4}
.ln.c1{stroke:var(--c1)}.ln.c2{stroke:var(--c2)}.ln.c3{stroke:var(--c3)}
.grid{stroke:var(--line);stroke-width:1}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.empty{color:var(--mute);text-align:center;padding:18px 8px}
a{color:var(--blue)}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);max-width:520px;width:calc(100% - 24px);padding:16px}
dialog::backdrop{background:rgba(0,0,0,.45)}
footer{max-width:1000px;margin:0 auto;padding:4px 12px 20px;color:var(--mute);font-size:12px}
@media print{header,nav,.noprint{display:none!important}body{padding:0}.card{break-inside:avoid}}
</style>
</head>
<body>
<header>
  <h1>우리 집 마련 플래너</h1>
  <span id="sync" class="chip">로컬</span>
  <button class="iconbtn" id="btnCfg" aria-label="설정">⚙ 설정</button>
</header>
<main id="app"></main>
<footer>
  정책·금리는 수시로 바뀝니다. 신청 전 공식 공고로 다시 확인하세요:
  <a href="https://nhuf.molit.go.kr" target="_blank" rel="noopener">주택도시기금</a> ·
  <a href="https://www.hf.go.kr" target="_blank" rel="noopener">한국주택금융공사</a> ·
  <a href="https://www.myhome.go.kr" target="_blank" rel="noopener">마이홈포털</a> ·
  <a href="https://rt.molit.go.kr" target="_blank" rel="noopener">실거래가 공개시스템</a>.
  이 앱의 계산은 참고용이며 금융·세무·법률 자문이 아닙니다.
</footer>
<nav id="nav"></nav>

<dialog id="dlg">
  <h3>연결 · 백업 설정</h3>
  <label class="f">내 이름 (수정자로 기록됩니다)<input id="cfgMe" placeholder="예: 동균"></label>
  <label class="f">Apps Script 웹 앱 URL (…/exec)<input id="cfgUrl" placeholder="https://script.google.com/macros/s/…/exec"></label>
  <label class="f">액세스 키 (Code.gs의 ACCESS_KEY와 같은 값)<input id="cfgKey" type="password" autocomplete="off"></label>
  <label class="f">마감 알림 받을 이메일 (쉼표로 구분, 선택)<input id="cfgMail" placeholder="a@example.com, b@example.com"></label>
  <p class="hint">URL·키는 이 기기 브라우저에만 저장됩니다(GitHub에 올라가지 않음). 소득·자산 정보가 들어가므로 키를 공개하지 마세요.</p>
  <div class="row" style="margin-top:10px">
    <button class="b fit" id="cfgSave">저장하고 연결</button>
    <button class="b ghost fit" id="cfgClose">닫기</button>
  </div>
  <hr style="border:0;border-top:1px solid var(--line);margin:14px 0">
  <div class="row">
    <button class="b ghost fit" id="btnExport">백업 내려받기(JSON)</button>
    <button class="b ghost fit" id="btnImport">백업 불러오기</button>
    <button class="b danger fit" id="btnReset">이 기기 데이터 초기화</button>
  </div>
  <input type="file" id="fileImport" accept="application/json" hidden>
</dialog>

<script>
/* ═════════════ 공식 정책 기준 (정책이 바뀌면 이 블록만 수정) ═════════════
   확인일: 2026-10-21
   ▸ 디딤돌: 주택도시기금 안내(경기주거복지포털 게재본·마이홈포털 대조)
   ▸ 보금자리론: 한국주택금융공사 안내(경기주거복지포털 게재본)
   단위: 금액은 모두 '만원' */
const POLICY = {
  verified: '2026-10-21',
  didimdol: {
    label: '내집마련 디딤돌대출', org: '주택도시기금(국토교통부)',
    src: [
      ['경기주거복지포털 · 디딤돌 안내', 'https://housing.gg.go.kr/html/24208.do'],
      ['마이홈포털 · 디딤돌 안내', 'https://www.myhome.go.kr/hws/portal/cont/selectSteppingStoneLoanView.do'],
      ['주택도시기금(신청·최신 공고)', 'https://nhuf.molit.go.kr']
    ],
    netAsset: 51100, floor: 1.5,
    terms: [10, 15, 20, 30],
    // [연소득 상한, [10년,15년,20년,30년 금리]]
    rates: [[2000,[2.85,2.90,3.05,3.10]],[4000,[3.20,3.30,3.40,3.45]],[7000,[3.55,3.65,3.75,3.80]],[8500,[3.90,4.00,4.10,4.15]]],
    modes: [['var','변동/5년 단위 변동 · 표 금리 기준 (+0%p)',0,'variable'],
            ['var5','5년 단위 변동 선택 (+0.1%p)',0.1,'variable'],
            ['fix10','10년 고정 적용 (+0.2%p)',0.2,'fixed'],
            ['fixed','순수 고정 선택 (+0.3%p)',0.3,'fixed']],
    manual: ['무주택 세대주(대출 신청일 기준)', '주택 매매계약 체결 후 신청', '대출 후 1개월 내 전입 · 2년 이상 실거주', '대출 기간 중 1주택 유지']
  },
  bogeum: {
    label: '보금자리론', org: '한국주택금융공사',
    src: [
      ['경기주거복지포털 · 보금자리론 안내', 'https://housing.gg.go.kr/html/24217.do'],
      ['한국주택금융공사(월별 공시금리)', 'https://www.hf.go.kr']
    ],
    terms: [10, 15, 20, 30, 40, 50],
    manual: ['한국신용정보원 규약 해당사항 없음 · CB점수 271점 이상', '채무자·배우자 주택 보유 수: 담보주택 제외 무주택 또는 1주택', '만기 50년은 만 40세 미만 등 조건부']
  }
};

/* ═════════════ 상태 ═════════════ */
const LS = 'homePlanner.v1', LSC = 'homePlanner.cfg', LSD = 'homePlanner.dirty';
const $ = (s, r = document) => r.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 10);
const now = () => Date.now();
const num = v => { const n = Number(v); return isFinite(n) ? n : 0; };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const won = v => { v = Math.round(num(v)); if (!v) return '0원'; const neg = v < 0; v = Math.abs(v); const e = Math.floor(v / 10000), m = v % 10000, a = []; if (e) a.push(e.toLocaleString() + '억'); if (m) a.push(m.toLocaleString() + '만'); return (neg ? '-' : '') + a.join(' ') + '원'; };
const pct = v => (Math.round(num(v) * 100) / 100).toFixed(2) + '%';

const DEFAULT_CHECK = ['무주택·세대 구성 확인 (주민등록등본)', '부부 소득·순자산 확인 (정책대출 자격)', '청약저축 가입·납입 내역 확인', '은행 대출 한도 사전 조회', '디딤돌 자격 사전 확인 (주택도시기금)', '보금자리론 모의심사 (한국주택금융공사)', '관심 단지 임장 · 실거래가 확인', '자금조달계획서 준비', '계약금 이체 · 매매계약서 작성', '대출 신청 (수탁은행 상담)', '잔금 · 소유권이전등기 · 전입신고', '취득세 신고·납부'];

function defState() {
  const t = 1;
  return {
    people: [{ id: 'p1', name: '나', income: 0, debt: 0, updatedAt: t }, { id: 'p2', name: '여자친구', income: 0, debt: 0, updatedAt: t }],
    capital: [], listings: [], loans: [],
    checklist: DEFAULT_CHECK.map((title, i) => ({ id: 'c' + i, title, owner: '', due: '', done: false, note: '', updatedAt: t })),
    scenarios: [1, 2, 3].map(i => ({ id: 's' + i, name: i + '번 시나리오', listingId: '', lines: [], memo: '', updatedAt: t })),
    settings: { _u: t, reserve: 3000, acqTax: 1.1, broker: 0.4, legal: 0.2, moving: 300, metro: true, marriage: '', emails: '',
      w: { walk: 3, south: 3, school: 2, park: 2, parking: 2, year: 1 } },
    decision: { _u: t, picked: '', memo: '', ack: {} }
  };
}
function normalize(s) {
  const d = defState(); s = s || d;
  for (const k of ['people', 'capital', 'listings', 'loans', 'checklist', 'scenarios']) if (!Array.isArray(s[k])) s[k] = d[k];
  s.settings = Object.assign({}, d.settings, s.settings || {}); s.settings.w = Object.assign({}, d.settings.w, (s.settings || {}).w || {});
  s.decision = Object.assign({}, d.decision, s.decision || {}); s.decision.ack = s.decision.ack || {};
  d.scenarios.forEach(x => { if (!s.scenarios.find(y => y.id === x.id)) s.scenarios.push(x); });
  s.scenarios.sort((a, b) => a.id.localeCompare(b.id));
  return s;
}
let S = normalize(JSON.parse(localStorage.getItem(LS) || 'null'));
let cfg = JSON.parse(localStorage.getItem(LSC) || '{}');
let ver = 0, dirty = localStorage.getItem(LSD) === '1', syncing = false, again = false, tab = 'capital', pendingRender = false;
const openSet = new Set(JSON.parse(sessionStorage.getItem('open') || '[]'));
const me = () => cfg.me || '나';
const touch = it => { it.updatedAt = now(); it.by = me(); };
const live = k => S[k].filter(x => !x.deleted);
const totalIncome = () => live('people').reduce((a, p) => a + num(p.income), 0);
const pname = id => (S.people.find(p => p.id === id) || {}).name || '';

/* ═════════════ 계산 ═════════════ */
function schedule(L, amount, add = 0) {
  const n = Math.round(num(L.years) * 12); amount = num(amount);
  if (!n || !amount) return [];
  const g = Math.min(n - 1, Math.round(num(L.grace) * 12)), st = L.rateStep;
  let bal = amount; const rows = [];
  for (let m = 1; m <= n; m++) {
    let rate = num(L.rate); if (st && m > st.afterMonths) rate = num(st.rate2);
    rate += add; const r = Math.max(0, rate) / 1200, int = bal * r; let prin = 0;
    if (L.method === 'bullet') prin = m === n ? bal : 0;
    else if (m <= g) prin = 0;
    else { const rem = n - m + 1; if (L.method === 'principal') prin = bal / rem; else { const pmt = r ? bal * r / (1 - Math.pow(1 + r, -rem)) : bal / rem; prin = pmt - int; } }
    if (m === n) prin = bal;
    bal -= prin; rows.push({ m, pay: int + prin, int, prin, bal: Math.max(0, bal) });
  }
  return rows;
}
const sum = a => a.reduce((x, y) => x + y, 0);

function calcDidimdol(o, c) {
  const P = POLICY.didimdol, ch = num(o.children), multi = ch >= 2, inc = c.income;
  const incLimit = Math.max(6000, (o.first || multi) ? 7000 : 0, o.newly ? 8500 : 0);
  const priceLimit = (o.newly || multi) ? 60000 : 50000;
  const cap = Math.max(20000, o.first ? 24000 : 0, (o.newly || multi) ? 32000 : 0);
  const ltv = (o.first && !c.metro) ? 80 : 70;
  const checks = [];
  checks.push([inc > 0 && inc <= incLimit, `부부합산 연소득 ${won(inc)} (기준 ${won(incLimit)} 이하)` + (inc <= 0 ? ' — 자본 탭에 소득 입력 필요' : '')]);
  checks.push([num(o.netAsset) <= P.netAsset, `순자산 ${won(o.netAsset)} (기준 ${won(P.netAsset)} 이하)`]);
  if (c.price) checks.push([c.price <= priceLimit, `주택가격 ${won(c.price)} (기준 ${won(priceLimit)} 이하 · 기금은 담보 평가액 기준)`]);
  if (c.areaM2) checks.push([c.areaM2 <= 85, `전용면적 ${c.areaM2}㎡ (기준 85㎡ 이하)`]);
  const ti = P.terms.indexOf(num(o.term)), row = P.rates.find(r => inc <= r[0]) || P.rates[P.rates.length - 1];
  const mode = P.modes.find(m => m[0] === o.mode) || P.modes[0];
  let base = row[1][ti < 0 ? 3 : ti] + mode[2]; if (!c.metro) base -= 0.2;
  const ch2 = ch >= 3 ? 0.7 : ch === 2 ? 0.5 : ch === 1 ? 0.3 : 0;
  const pref = Math.max(o.newly ? 0.2 : 0, o.first ? 0.2 : 0, ch2);
  const add = num(o.savings) + (o.eContract ? 0.1 : 0);
  const capPref = ch >= 3 ? 0.7 : 0.5, tot = Math.min(capPref, pref + add);
  const rate = Math.max(P.floor, base - tot), rate2 = Math.max(P.floor, base);
  const max = Math.round(c.price ? Math.min(cap, c.price * ltv / 100) : cap);
  const notes = [`한도 = 상품 한도 ${won(cap)}와 매매가×LTV ${ltv}% 중 작은 금액 (심사 시 DTI 60%·선순위채권 추가 반영)`,
    `우대금리(${pct(tot)}p)는 최대 5년 적용 → 이후 ${pct(rate2)}로 상승한다고 가정(보수적)`, `최저금리 ${P.floor}% 하한 적용`];
  return { checks, ok: checks.every(x => x[0]), max, rate, rate2: rate2 > rate ? rate2 : null, rateType: mode[3], notes, manual: P.didimdol ? [] : POLICY.didimdol.manual };
}
function calcBogeum(o, c) {
  const ch = num(o.children), inc = c.income;
  const incLimit = Math.max(7000, o.newly ? 8500 : 0, ch === 1 ? 8000 : 0, ch === 2 ? 9000 : 0, ch >= 3 ? 10000 : 0);
  const cap = Math.max(36000, ch >= 3 ? 40000 : 0, o.first ? 42000 : 0);
  const ltv = o.first ? 80 : 70;
  const checks = [];
  checks.push([inc > 0 && inc <= incLimit, `부부합산 연소득 ${won(inc)} (기준 ${won(incLimit)} 이하)` + (inc <= 0 ? ' — 자본 탭에 소득 입력 필요' : '')]);
  if (c.price) checks.push([c.price <= 60000, `주택가격 ${won(c.price)} (기준 6억원 이하)`]);
  const base = num(o.baseRate) || 4.1;
  const p1 = o.newly ? 0.2 : (o.newborn ? 0.2 : 0), p2 = Math.min(2, num(o.social)) * 0.7, p3 = o.green ? 0.1 : 0;
  const tot = Math.min(1, p1 + p2 + p3), rate = Math.max(0, base - tot);
  const max = Math.round(c.price ? Math.min(cap, c.price * ltv / 100) : cap);
  const notes = [`한도 = 상품 한도 ${won(cap)}와 매매가×LTV ${ltv}% 중 작은 금액`,
    '⚠️ LTV 70%(생애최초 80%)·DTI 60%는 공식 안내 본문에서 확인하지 못한 2차 자료 기준입니다 — 한국주택금융공사 모의심사로 확인하세요',
    '공시금리는 매월 바뀌며 만기별로 다릅니다 (안내 범위 연 3.95~4.25%, 아낌e 기준). 직접 입력하세요'];
  return { checks, ok: checks.every(x => x[0]), max, rate, rate2: null, rateType: 'fixed', notes, manual: [] };
}
function policyCalc(L, listing) {
  const o = L.opt || {}; const li = listing !== undefined ? listing : S.listings.find(x => x.id === o.listingId && !x.deleted);
  const c = { price: li ? num(li.price) : num(o.price), areaM2: li ? num(li.areaM2) : num(o.areaM2), income: totalIncome(), metro: !!S.settings.metro };
  return L.kind === 'didimdol' ? calcDidimdol(o, c) : calcBogeum(o, c);
}
const isPolicy = L => L.kind === 'didimdol' || L.kind === 'bogeum';

function usableCapital() { return Math.max(0, sum(live('capital').filter(c => c.liquidity !== 'lock').map(c => num(c.amount))) - num(S.settings.reserve)); }
function evalScenario(sc) {
  const li = S.listings.find(x => x.id === sc.listingId && !x.deleted), price = li ? num(li.price) : 0;
  const lines = (sc.lines || []).map(ln => ({ ln, L: S.loans.find(x => x.id === ln.loanId && !x.deleted) })).filter(o => o.L);
  const sch = lines.map(o => schedule(o.L, o.ln.amount));
  const sch1 = lines.map(o => schedule(o.L, o.ln.amount, o.L.rateType === 'variable' ? 1 : 0));
  const sch2 = lines.map(o => schedule(o.L, o.ln.amount, num(o.L.stress)));
  const n = Math.max(0, ...sch.map(s => s.length));
  const tot = (arr, i) => sum(arr.map(s => s[i] ? s[i].pay : 0));
  const monthly = Array.from({ length: n }, (_, i) => tot(sch, i)), monthly1 = Array.from({ length: n }, (_, i) => tot(sch1, i));
  const loanTotal = sum(lines.map(o => num(o.ln.amount)));
  const st = S.settings, costs = price ? price * (num(st.acqTax) + num(st.broker) + num(st.legal)) / 100 + num(st.moving) : 0;
  const need = price - loanTotal + costs, usable = usableCapital(), gap = usable - need;
  const incM = totalIncome() / 12, interest = sum(sch.map(s => sum(s.map(r => r.int))));
  const maxPay = Math.max(0, ...monthly), first = monthly[0] || 0;
  const dsrPay = sum(sch2.map(s => sum(s.slice(0, 12).map(r => r.pay)))) + sum(live('people').map(p => num(p.debt))) * 12;
  const e = { sc, li, price, lines, monthly, monthly1, loanTotal, costs, need, usable, gap, incM, interest, maxPay, first,
    maxPay1: Math.max(0, ...monthly1), years: Math.max(0, ...lines.map(o => num(o.L.years))), ltv: price ? loanTotal / price * 100 : 0,
    ratio: incM ? maxPay / incM * 100 : 0, dsr: totalIncome() ? dsrPay / totalIncome() * 100 : 0, warns: [], has: !!(li && lines.length) };
  const W = (code, level, text) => e.warns.push({ code: sc.id + ':' + code, level, text });
  if (!li) W('nolist', 'info', '매물을 선택하면 필요 현금을 계산합니다.');
  if (li && !lines.length) W('noloan', 'info', '대출을 하나 이상 골라야 월 상환액이 계산됩니다.');
  if (e.has) {
    if (gap < 0) W('short', 'red', `자본 ${won(-gap)} 부족 — 대출을 늘리거나 매물·예비비를 조정해야 합니다.`);
    else if (gap < price * 0.02) W('thin', 'warn', `자본 여유가 ${won(gap)}로 얇습니다 (이사·수리·세금 변동 대비).`);
    if (e.ltv > 70) W('ltv', 'warn', `대출 비중 ${e.ltv.toFixed(0)}% — LTV 한도(보통 70%, 규제에 따라 다름)를 넘을 수 있습니다.`);
    if (incM && e.ratio >= 40) W('ratio', 'red', `최대 월 상환이 월 소득(세전)의 ${e.ratio.toFixed(0)}% — 생활비 압박이 큽니다.`);
    else if (incM && e.ratio >= 30) W('ratio', 'warn', `최대 월 상환이 월 소득(세전)의 ${e.ratio.toFixed(0)}%입니다.`);
    if (!incM) W('noinc', 'info', '소득이 입력되지 않아 소득 대비 비율을 계산하지 못했습니다.');
    if (e.maxPay1 > e.maxPay + 1) W('rate1', 'warn', `변동금리 대출이 +1%p 오르면 최대 월 상환이 ${won(e.maxPay1 - e.maxPay)} 늘어납니다.`);
    lines.forEach(o => {
      const L = o.L, a = num(o.ln.amount);
      if (!a) return;
      if (isPolicy(L)) {
        const r = policyCalc(L, li);
        if (!r.ok) W('el' + L.id, 'red', `${L.name}: 자격 조건 미충족 ${r.checks.filter(x => !x[0]).length}건 (대출 탭에서 확인)`);
        if (a > r.max) W('lim' + L.id, 'red', `${L.name}: 금액이 예상 한도 ${won(r.max)}를 넘습니다.`);
        if (L.rateStep) W('step' + L.id, 'warn', `${L.name}: 우대금리 종료(5년 후) 시 금리 ${pct(L.rate)} → ${pct(L.rateStep.rate2)}.`);
      } else W('apx' + L.id, 'info', `${L.name}은(는) 대략값입니다 — 은행 한도·금리 조회로 확정 필요.`);
      if (L.method === 'bullet') W('bul' + L.id, 'warn', `${L.name}: 만기일시상환 — 만기에 원금 ${won(a)} 상환(또는 재약정) 필요.`);
      if (num(L.grace) > 0) W('gr' + L.id, 'info', `${L.name}: 거치 ${L.grace}년 후 월 상환액이 커집니다.`);
    });
    if (live('capital').some(c => c.source === 'loan' && num(c.amount) > 0)) W('borrow', 'warn', '자본에 차용금이 포함되어 있습니다 — 상환 부담이 별도로 생깁니다.');
    if (live('capital').some(c => c.source === 'gift' && num(c.amount) > 0)) W('gift', 'info', '증여 자금 포함 — 증여세·자금조달계획서 확인.');
    if (e.dsr > 40) W('dsr', 'warn', `단순 DSR 참고치 ${e.dsr.toFixed(0)}% (은행권 규제 기준 40%, 스트레스 금리 반영) — 정책대출의 DSR 적용 여부는 상품별로 확인.`);
  }
  return e;
}

function chartSVG(evs) {

  const X = m => pl + (W - pl - pr) * m / maxM, Y = v => H - pb - (H - pt - pb) * v / maxY;
  let g = ''; for (let i = 0; i <= 4; i++) { const v = maxY * i / 4, y = Y(v); g += `<line class="grid" x1="${pl}" x2="${W - pr}" y1="${y}" y2="${y}"/><text x="${pl - 6}" y="${y + 4}" text-anchor="end">${won(v).replace('원', '')}</text>`; }
  const step = maxM > 240 ? 10 : 5; for (let y = 0; y * 12 <= maxM; y += step) g += `<text x="${X(y * 12)}" y="${H - 8}" text-anchor="middle">${y}년</text>`;
  const lines = evs.map((e, i) => e.monthly.length ? `<polyline class="ln c${i + 1}" points="${e.monthly.map((v, m) => `${X(m).toFixed(1)},${Y(v).toFixed(1)}`).join(' ')}"/>` : '').join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="시나리오별 월 상환액 추이" style="width:100%;height:auto">${g}${lines}</svg>`;
}

});
function addLoan(kind) {
  const base = { id: uid(), kind, name: '', amount: 0, rate: 0, years: 30, method: 'equal', grace: 0, rateType: 'variable', stress: 0, rateStep: null, updatedAt: now(), by: me() };
  if (kind === 'didimdol') Object.assign(base, { name: POLICY.didimdol.label, opt: { listingId: '', price: 0, term: 30, first: false, newly: false, children: 0, netAsset: 0, mode: 'var', savings: 0, eContract: false } });
  else if (kind === 'bogeum') Object.assign(base, { name: POLICY.bogeum.label, rateType: 'fixed', opt: { listingId: '', price: 0, term: 30, first: false, newly: false, children: 0, baseRate: 4.1, social: 0, newborn: false, green: false } });
  else if (kind === 'bank') Object.assign(base, { name: '은행 주담대 (대략)', rate: 4.0, stress: 3.0 });
  else if (kind === 'credit') Object.assign(base, { name: '신용대출 (대략)', rate: 5.5, years: 5, method: 'bullet', stress: 1.5 });
  else Object.assign(base, { name: '기타 대출', rate: 4.0 });
  S.loans.push(base); afterEdit();
}
function applyPolicy(id) {
  const L = S.loans.find(x => x.id === id), r = policyCalc(L);
  L.amount = r.max; L.rate = Math.round(r.rate * 100) / 100; L.years = num(L.opt.term); L.rateType = r.rateType; L.method = L.method === 'bullet' ? 'equal' : L.method;
  L.rateStep = r.rate2 ? { afterMonths: 60, rate2: Math.round(r.rate2 * 100) / 100 } : null; L.verified = POLICY.verified; touch(L); afterEdit();
}

/* ═════════════ 저장 · 동기화 ═════════════ */
function persist() { localStorage.setItem(LS, JSON.stringify(S)); dirty = true; localStorage.setItem(LSD, '1'); }
function setStatus(k, msg) {
  const el = $('#sync'); el.className = 'chip' + (k === 'err' ? ' err' : '');
  el.textContent = { local: '로컬 저장', saving: '저장 중…', ok: '시트 저장됨 ' + new Date().toTimeString().slice(0, 5), offline: '오프라인(재시도)', err: '오류: ' + (msg || '') }[k];
}
async function api(action, p = {}) {
  const res = await fetch(cfg.url, { method: 'POST', body: JSON.stringify(Object.assign({ action, key: cfg.key }, p)), redirect: 'follow' });
  return res.json();
}
function merge(l, r) {
  if (!r) return l; const out = Object.assign({}, l);
  for (const k of ['people', 'capital', 'listings', 'loans', 'checklist', 'scenarios']) {
    const m = new Map(); (r[k] || []).forEach(x => m.set(x.id, x));
    (l[k] || []).forEach(x => { const y = m.get(x.id); if (!y || num(x.updatedAt) >= num(y.updatedAt)) m.set(x.id, x); }); out[k] = [...m.values()];
  }
  for (const k of ['settings', 'decision']) out[k] = num((l[k] || {})._u) >= num((r[k] || {})._u) ? l[k] : r[k];
  return normalize(out);
}
let timer = null;
function scheduleSync() { if (!cfg.url || !cfg.key) { setStatus('local'); return; } clearTimeout(timer); timer = setTimeout(sync, 1200); }
async function sync() {
  if (!cfg.url || !cfg.key) return setStatus('local');
  if (syncing) { again = true; return; }
  syncing = true; setStatus('saving');
  try {
    let r = await api('save', { baseVersion: ver, state: S, by: me() });
    for (let i = 0; r.ok && r.conflict && i < 3; i++) { S = merge(S, r.state); ver = r.version; persist(); r = await api('save', { baseVersion: ver, state: S, by: me(), force: i === 2 }); }
    if (r.ok && !r.conflict) { ver = r.version; dirty = false; localStorage.setItem(LSD, '0'); setStatus('ok'); render(true); } else setStatus('err', r.error || '저장 실패');
  } catch (err) { setStatus('offline'); }
  syncing = false; if (again) { again = false; sync(); }
}
async function pull() {
  if (!cfg.url || !cfg.key || syncing) return;
  try {
    const r = await api('load'); if (!r.ok) return setStatus('err', r.error);
    if (r.state && r.version !== ver) { S = merge(S, r.state); ver = r.version; localStorage.setItem(LS, JSON.stringify(S)); render(true); }
    ver = r.version;
    if (dirty) sync(); else setStatus('ok');
  } catch (err) { setStatus('offline'); }
}
setInterval(pull, 30000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) pull(); });
window.addEventListener('online', () => { dirty = true; sync(); });

/* ═════════════ 설정 · 백업 ═════════════ */
const dlg = $('#dlg');
$('#btnCfg').onclick = () => { $('#cfgMe').value = cfg.me || ''; $('#cfgUrl').value = cfg.url || ''; $('#cfgKey').value = cfg.key || ''; $('#cfgMail').value = S.settings.emails || ''; dlg.showModal(); };
$('#cfgClose').onclick = () => dlg.close();
$('#cfgSave').onclick = async () => {
  cfg = { me: $('#cfgMe').value.trim(), url: $('#cfgUrl').value.trim(), key: $('#cfgKey').value.trim() };
  localStorage.setItem(LSC, JSON.stringify(cfg));
  S.settings.emails = $('#cfgMail').value.trim(); S.settings._u = now(); S.settings.by = me(); persist();
  dlg.close(); setStatus(cfg.url ? 'saving' : 'local'); await pull(); render();
};
$('#btnExport').onclick = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' })); a.download = 'home-planner-' + new Date().toISOString().slice(0, 10) + '.json'; a.click(); };
$('#btnImport').onclick = () => $('#fileImport').click();
$('#fileImport').onchange = e => { const f = e.target.files[0]; if (!f) return; const rd = new FileReader(); rd.onload = () => { try { S = normalize(JSON.parse(rd.result)); S.settings._u = now(); persist(); scheduleSync(); render(); dlg.close(); } catch (x) { alert('JSON 파일을 읽지 못했습니다.'); } }; rd.readAsText(f); };
$('#btnReset').onclick = () => { if (confirm('이 기기에 저장된 데이터를 지웁니다. 구글 시트의 데이터는 그대로 남습니다.')) { localStorage.removeItem(LS); localStorage.removeItem(LSD); location.reload(); } };

/* ═════════════ 시작 ═════════════ */
render();
if (cfg.url && cfg.key) { setStatus('saving'); pull(); } else setStatus('local');
</script>
</body>
